# Benchmark overlay — layers on top of base (memory mode) or base + postgres.
# Disables the in-app search cache and rate limits so the numbers reflect the
# spatial path, not the LRU or the limiter. Used by scripts/bench.sh.
#
# Usage:  docker compose -f docker-compose.yml \
#                       [-f docker-compose.postgres.yml] \
#                       -f docker-compose.bench.yml up -d --build

services:
  api:
    environment:
      LOG_LEVEL: warn
      SEARCH_CACHE_SIZE: '0'
      RATE_LIMIT_READ_MAX: '1000000'
      RATE_LIMIT_WRITE_MAX: '1000000'
      RATE_LIMIT_AUTH_MAX: '1000000'
      RATE_LIMIT_GLOBAL_MAX: '1000000'
