name: nearby-locations-api

services:
  api:
    build: .
    image: nearby-locations-api:latest
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      LOG_LEVEL: info
    # For PostgreSQL + PostGIS mode, layer on docker-compose.postgres.yml — either via
    # `npm run compose:postgres` or
    # `docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build`.
