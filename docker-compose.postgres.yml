services:
  api:
    environment:
      LOCATIONS_BACKEND: postgres
      DATABASE_URL: postgres://locations:locations@postgres:5432/locations
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: locations
      POSTGRES_PASSWORD: locations
      POSTGRES_DB: locations
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U locations -d locations']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
